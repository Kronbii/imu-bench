name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.12"] # 3.8 is what JetPack 5 ships
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pymavlink
      - run: python -m unittest discover -s tests -v
      - name: CLI smoke test (simulator, recording, replay)
        run: |
          timeout 4 ./imu-bench sim --emulate raw --no-web --record run.ndjson || true
          grep -q '"source":"fusion"' run.ndjson
          timeout 3 ./imu-bench replay run.ndjson --once --no-web || true

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc --noEmit, then vite build
        working-directory: web

  bridge:
    name: SDK + bridge (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake libyaml-cpp-dev libudev-dev
      - run: cmake -S sdk -B sdk/build -DCMAKE_BUILD_TYPE=Release && cmake --build sdk/build -j 4
      - run: cmake -S bridge -B bridge/build -DCMAKE_BUILD_TYPE=Release && cmake --build bridge/build -j 4
      - run: ./bridge/build/imx_bridge --help || test $? -eq 2
